<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIRENE — Carte par département</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="lib/sirene-core.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f3ef;
      --surface:  #ffffff;
      --card:     #fafaf8;
      --border:   #ddd9d0;
      --accent:   #1a3a6b;
      --accent2:  #c8342a;
      --text:     #1a1a1a;
      --muted:    #6b6760;
      --radius:   6px;
      --mono:     'IBM Plex Mono', monospace;
      --sans:     'IBM Plex Sans', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      height: 52px;
      flex-shrink: 0;
    }
    .topbar-logo {
      font-family: var(--mono);
      font-weight: 600;
      font-size: .95rem;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .topbar-logo span { color: #a8c4f5; }
    .topbar-sep { width: 1px; height: 24px; background: rgba(255,255,255,.25); }
    .topbar-sub { font-size: .78rem; color: rgba(255,255,255,.65); }

    .toolbar {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .toolbar label {
      font-family: var(--mono);
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .toolbar select, .toolbar input {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: .82rem;
      padding: 7px 12px;
      outline: none;
    }
    .toolbar select:focus, .toolbar input:focus { border-color: var(--accent); }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .scan-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
    }
    .scan-status .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #map { flex: 1; }

    .dept-tooltip {
      font-family: var(--sans);
      font-size: .82rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    .dept-tooltip .code {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--accent);
      margin-right: 4px;
    }
    .dept-tooltip .tt-count {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--accent2);
    }
    .dept-tooltip .status {
      font-size: .65rem;
      font-weight: 400;
      color: var(--muted);
      display: block;
      margin-top: 2px;
    }

    .leaflet-popup-content-wrapper {
      border-radius: var(--radius) !important;
      font-family: var(--sans) !important;
      box-shadow: 0 4px 20px rgba(0,0,0,.12) !important;
      border: 1px solid var(--border) !important;
    }

    /* Count labels on map */
    .dept-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: #1a3a6b;
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 1px 1px 0 #fff, -1px -1px 0 #fff;
      white-space: nowrap;
      pointer-events: none;
    }
    .dept-label.has-data { color: #7a2520; }
    .dept-label.no-data { color: #bbb; font-weight: 400; font-size: 9px; }

    .info-panel {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 1000;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
      font-size: .78rem;
      color: var(--muted);
      max-width: 300px;
      line-height: 1.5;
    }
    .info-panel strong { color: var(--text); }
    .info-panel .total {
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent);
      display: block;
      margin-bottom: 4px;
    }

    .color-scale {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
      font-size: .68rem;
      color: var(--muted);
    }
    .color-scale-title {
      font-family: var(--mono);
      font-weight: 600;
      font-size: .62rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .scale-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: .62rem;
      line-height: 1.6;
      white-space: nowrap;
    }
    .swatch {
      width: 14px; height: 10px;
      border-radius: 2px;
      border: 1px solid rgba(0,0,0,.12);
      flex-shrink: 0;
    }
    .color-scale-note { font-size: .58rem; margin-top: 4px; opacity: .8; }

    .topbar-link {
      margin-left: auto;
      color: #fff;
      font-size: .75rem;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: var(--radius);
      padding: 5px 10px;
      white-space: nowrap;
    }
    .topbar-link:hover { background: rgba(255,255,255,.12); }
    .info-panel .hint { font-size: .7rem; }

    /* Petits écrans : panneaux compacts */
    @media (max-width: 700px) {
      body { height: 100dvh; }
      .topbar { padding: 0 12px; gap: 10px; }
      .topbar-sub, .topbar-sep { display: none; }
      .toolbar { padding: 8px 12px; gap: 8px; }
      .toolbar .field-group { flex: 1 1 40%; min-width: 0; }
      .toolbar select { width: 100%; }
      .scan-status { margin-left: 0; width: 100%; }
      .info-panel { left: 8px; bottom: 8px; padding: 8px 10px; max-width: 46vw; }
      .info-panel .total { font-size: 1.1rem; }
      .info-panel .hint { display: none; }
      .color-scale { right: 8px; bottom: 8px; padding: 8px 10px; }
      .color-scale-note { display: none; }
    }

  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">SIRENE<span>.explorer</span></div>
  <div class="topbar-sep"></div>
  <div class="topbar-sub">Carte des départements — Cliquez pour voir les établissements</div>
  <a class="topbar-link" href="sirene-explorer.html">Explorer / générer ⟶</a>
</div>

<div class="toolbar">
  <div class="field-group">
    <label for="nafSelect">Activité</label>
    <select id="nafSelect" onchange="updateNaf()">
      <option value="11.05Z" selected>11.05Z — Fabrication de bière</option>
    </select>
  </div>

  <div class="field-group">
    <label for="modeSelect">Mesure</label>
    <select id="modeSelect" onchange="updateMode()">
      <option value="count">Nombre d'établissements</option>
      <option value="hab">Pour 10 000 habitants</option>
      <option value="new">Nouveaux depuis la dernière mise à jour</option>
    </select>
  </div>

  <div class="scan-status" id="scanStatus"></div>
</div>

<div id="map"></div>

<div class="info-panel" id="infoPanel">
  <span class="total" id="totalCount">—</span>
  <strong>Établissements trouvés</strong><br/>
  <span id="infoDetails">Chargement…</span>
</div>

<div class="color-scale" id="colorScale" style="display:none">
  <div class="color-scale-title" id="scaleTitle">Établissements</div>
  <div id="scaleItems"></div>
  <div class="color-scale-note">Classes de même effectif (quantiles)</div>
</div>

<script>
const { DEPT_NAMES, DEPT_CODES, DEPT_POPULATION, NAF_DICT, escHtml: esc, exportFileName } = SireneCore;

let currentNaf = '11.05Z';
let mode = 'count';    // 'count' | 'hab' (pour 10 000 habitants) | 'new' (nouveaux établissements)
let geoLayer = null;
let deptCounts = {};   // { "38": 12, "69": 5, ... } — null = pas d'export
let deptInfo = {};     // { "38": { geo, total, opened, closed, since } } — détails du manifest, si connus
let deptLabels = [];   // L.marker label references
let breaks = [];       // bornes des classes de couleur (quantiles)
let cachedGeoJson = null;
let manifest = null;   // exports/manifest.json (null = absent → scan des fichiers)
const scanCache = {};  // { "11.05Z": { "38": 12, ... }, ... }

const map = L.map('map', { zoomSnap: 0.25 }).setView([46.6, 2.5], 6);
// Fond OpenStreetMap standard, atténué pour laisser ressortir la choroplèthe
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> · populations légales INSEE',
  maxZoom: 19,
  opacity: 0.6,
}).addTo(map);

// Fusionne les features 2A et 2B en un seul MultiPolygon "20" (sans effet sur
// data/departements.geojson, déjà fusionné ; conservé pour d'autres sources)
function preprocessGeoJson(data) {
  if (!data.features.some(f => f.properties.code === '2A')) return data;
  function toPolygons(feat) {
    if (!feat) return [];
    const g = feat.geometry;
    return g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
  }
  const f2A = data.features.find(f => f.properties.code === '2A');
  const f2B = data.features.find(f => f.properties.code === '2B');
  const corseFeat = {
    type: 'Feature',
    properties: { code: '20', nom: 'Corse' },
    geometry: { type: 'MultiPolygon', coordinates: [...toPolygons(f2A), ...toPolygons(f2B)] }
  };
  const others = data.features.filter(f => f.properties.code !== '2A' && f.properties.code !== '2B');
  return { ...data, features: [...others, corseFeat] };
}

function exportUrl(deptCode) {
  return 'exports/' + exportFileName(currentNaf, deptCode);
}

// ── Valeurs et classes de couleur ────────────────────────────────────────────

// Palette séquentielle (YlOrRd, ColorBrewer)
const COLORS = ['#ffffcc','#ffeda0','#fed976','#feb24c','#fd8d3c','#fc4e2a','#e31a1c','#b10026'];
const NO_DATA = '#f0eeea';

function perHab(code) {
  const c = deptCounts[code], pop = DEPT_POPULATION[code];
  return c != null && pop ? c / pop * 10000 : null;
}

function valueOf(code) {
  const c = deptCounts[code];
  if (c == null) return null;
  if (mode === 'new') return deptInfo[code]?.opened ?? null;
  return mode === 'hab' ? perHab(code) : c;
}

// « +3 nouveaux · −1 disparu »
function chgText(opened, closed) {
  return '<b style="color:#2d7a50">+' + opened.toLocaleString('fr-FR') + '</b> nouveau' + (opened > 1 ? 'x' : '') + ' · '
    + '<b style="color:#c8342a">−' + closed.toLocaleString('fr-FR') + '</b> disparu' + (closed > 1 ? 's' : '');
}

function frDate(iso) {
  return iso ? new Date(iso).toLocaleDateString('fr-FR') : '';
}

function fmt(v) {
  if (v == null) return '—';
  if (mode !== 'hab') return Math.round(v).toLocaleString('fr-FR');
  return v.toLocaleString('fr-FR', { maximumFractionDigits: v < 10 ? 1 : 0 });
}

// Bornes par quantiles : chaque couleur regroupe à peu près autant de départements,
// pour qu'un département très au-dessus des autres (Paris) n'écrase pas l'échelle.
function computeBreaks() {
  const vals = DEPT_CODES.map(valueOf).filter(v => v != null && v > 0).sort((a, b) => a - b);
  breaks = [];
  if (!vals.length) return;
  const k = Math.min(COLORS.length, vals.length);
  for (let i = 1; i < k; i++) {
    const b = vals[Math.floor(i * vals.length / k)];
    if (!breaks.length || b > breaks[breaks.length - 1]) breaks.push(b);
  }
  breaks.min = vals[0];
  breaks.max = vals[vals.length - 1];
}

function classOf(v) {
  let i = 0;
  while (i < breaks.length && v >= breaks[i]) i++;
  return i;
}

// Étale les classes effectives sur toute la palette
function colorOfClass(i) {
  const n = breaks.length + 1;
  return COLORS[n <= 1 ? COLORS.length - 1 : Math.round(i * (COLORS.length - 1) / (n - 1))];
}

function getColor(v) {
  if (v == null || v <= 0) return NO_DATA;
  return colorOfClass(classOf(v));
}

function styleForDept(feature) {
  const v = valueOf(feature.properties.code);
  const has = v != null && v > 0;
  return {
    fillColor: getColor(v),
    fillOpacity: has ? 0.75 : 0.3,
    color: has ? '#1a3a6b' : '#ccc',
    weight: 1.2,
    opacity: 0.6,
  };
}

function styleHover() {
  return {
    fillColor: '#c8342a',
    fillOpacity: 0.6,
    color: '#c8342a',
    weight: 2.5,
    opacity: 1,
  };
}

function tooltipHtml(code) {
  const name = esc(DEPT_NAMES[code] || code);
  const count = deptCounts[code];
  const info = deptInfo[code] || {};
  const hasExport = count != null;
  let html = '<div class="dept-tooltip"><span class="code">' + code + '</span> ' + name + '<br/>';
  if (!hasExport) return html + '<span style="color:#bbb">Pas d\'export</span></div>';
  html += '<span class="tt-count">' + count.toLocaleString('fr-FR') + ' établissement' + (count > 1 ? 's' : '') + '</span>';
  const ph = perHab(code);
  if (ph != null) html += '<span class="status">' + ph.toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' pour 10 000 hab. · '
    + DEPT_POPULATION[code].toLocaleString('fr-FR') + ' hab.</span>';
  if (info.opened != null) {
    html += '<span class="status">' + chgText(info.opened, info.closed)
      + (info.since ? ' depuis le ' + frDate(info.since) : '') + '</span>';
  }
  if (info.geo != null && info.geo < count) {
    const n = count - info.geo;
    html += '<span class="status">dont ' + n.toLocaleString('fr-FR') + ' sans position sur la carte</span>';
  }
  if (count > 0) html += '<span class="status">→ ' + esc(exportFileName(currentNaf, code)) + '</span>';
  return html + '</div>';
}

function onEachDept(feature, layer) {
  const code = feature.properties.code;
  layer.bindTooltip(() => tooltipHtml(code), { sticky: true, direction: 'top', offset: [0, -10] });
  layer.on('mouseover', function () { this.setStyle(styleHover()); this.bringToFront(); });
  layer.on('mouseout', function () { geoLayer.resetStyle(this); });
  layer.on('click', function () {
    if (deptCounts[code] > 0) window.open(exportUrl(code), '_blank');
  });
}

function clearLabels() {
  deptLabels.forEach(m => map.removeLayer(m));
  deptLabels = [];
}

function addLabels() {
  clearLabels();
  if (!geoLayer) return;
  geoLayer.eachLayer(function (layer) {
    const code = layer.feature.properties.code;
    const v = valueOf(code);
    // Pour la Corse (MultiPolygon), le centre de la bbox tombe en mer — on fixe manuellement
    const center = code === '20' ? L.latLng(42.1, 9.1) : layer.getBounds().getCenter();
    const cssClass = v > 0 ? 'dept-label has-data' : 'dept-label no-data';
    const marker = L.marker(center, {
      icon: L.divIcon({ className: cssClass, html: v == null ? '—' : fmt(v), iconSize: [40, 14], iconAnchor: [20, 7] }),
      interactive: false,
    }).addTo(map);
    deptLabels.push(marker);
  });
}

function loadGeoJson(data) {
  if (geoLayer) map.removeLayer(geoLayer);
  geoLayer = L.geoJSON(data, {
    style: styleForDept,
    onEachFeature: onEachDept,
    filter: function (feature) { return !!DEPT_NAMES[feature.properties.code]; }
  }).addTo(map);
  // Premier affichage : cadre la métropole quelle que soit la taille d'écran
  if (!loadGeoJson.framed) { map.fitBounds(geoLayer.getBounds(), { padding: [10, 10] }); loadGeoJson.framed = true; }
  addLabels();
}

function refreshMap() {
  computeBreaks();
  updateInfoPanel();
  updateColorScale();
  if (cachedGeoJson) loadGeoJson(cachedGeoJson);
}

function updateInfoPanel() {
  const withData = DEPT_CODES.filter(c => deptCounts[c] > 0);
  const total = withData.reduce((a, c) => a + deptCounts[c], 0);
  const pop = withData.reduce((a, c) => a + (DEPT_POPULATION[c] || 0), 0);
  const nbDepts = withData.length;
  document.getElementById('totalCount').textContent = total.toLocaleString('fr-FR');
  // Évolution depuis la mise à jour précédente (si le manifest la connaît)
  const withChg = DEPT_CODES.filter(c => deptInfo[c]?.opened != null);
  const opened = withChg.reduce((a, c) => a + deptInfo[c].opened, 0);
  const closed = withChg.reduce((a, c) => a + deptInfo[c].closed, 0);
  const since = withChg.map(c => deptInfo[c].since).filter(Boolean).sort()[0];
  let chg = '';
  if (withChg.length) {
    chg = '<br/>' + chgText(opened, closed)
      + (since ? ' depuis le ' + frDate(since) : '');
  } else if (mode === 'new') {
    chg = '<br/><span class="hint" style="display:inline">Pas encore d\'historique pour cette activité : disponible après la prochaine mise à jour.</span>';
  }
  document.getElementById('infoDetails').innerHTML =
    '<strong>' + nbDepts + '</strong> département' + (nbDepts > 1 ? 's' : '') + ' avec données'
    + (pop ? ' · ' + (total / pop * 10000).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' pour 10 000 hab.' : '')
    + chg
    + '<br/><span class="hint">Cliquez sur un département pour ouvrir sa carte.</span>';
}

function updateColorScale() {
  const scale = document.getElementById('colorScale');
  if (breaks.max == null) { scale.style.display = 'none'; return; }
  scale.style.display = '';
  document.getElementById('scaleTitle').textContent =
    mode === 'hab' ? 'Pour 10 000 habitants' : mode === 'new' ? 'Nouveaux établissements' : 'Établissements';
  const bounds = [breaks.min].concat(breaks, [breaks.max]);
  let html = '';
  for (let i = breaks.length; i >= 0; i--) {
    const lo = bounds[i], hi = bounds[i + 1];
    html += '<div class="scale-row"><span class="swatch" style="background:' + colorOfClass(i) + '"></span>'
      + (i === breaks.length ? fmt(lo) + ' et plus' : fmt(lo) + ' – ' + fmt(hi)) + '</div>';
  }
  html += '<div class="scale-row"><span class="swatch" style="background:' + NO_DATA + '"></span>Aucun / pas d\'export</div>';
  document.getElementById('scaleItems').innerHTML = html;
}

// ── Données : manifest, ou scan des pages à défaut ───────────────────────────

async function fetchCount(rawCode) {
  try {
    const res = await fetch(exportUrl(rawCode));
    if (!res.ok) return null;
    const html = await res.text();
    // Prefer the explicit meta tag (fast, robust)
    const meta = html.match(/<meta\s+name="sirene:count"\s+content="(\d+)"/i);
    if (meta) return parseInt(meta[1], 10);
    const titleMatch = html.match(/(\d+)\s*[eé]tablissements/);
    return titleMatch ? parseInt(titleMatch[1], 10) : null;
  } catch {
    return null;
  }
}

// Décomptes lus dans le manifest (un seul fichier) quand il couvre l'activité
function countsFromManifest() {
  const entry = manifest?.naf?.[currentNaf];
  if (!entry?.depts) return false;
  deptCounts = {};
  deptInfo = {};
  DEPT_CODES.forEach(code => {
    const d = entry.depts[code];
    deptCounts[code] = d ? d.count : null;
    if (d) deptInfo[code] = { geo: d.geo, total: d.total, opened: d.opened, closed: d.closed, since: d.since };
  });
  const found = DEPT_CODES.filter(c => deptCounts[c] > 0).length;
  const dates = Object.values(entry.depts).map(d => d.generated).filter(Boolean).sort();
  const updated = dates.length ? ' · données du ' + new Date(dates[dates.length - 1]).toLocaleDateString('fr-FR') : '';
  document.getElementById('scanStatus').innerHTML =
    '&#x2714; ' + found + '/' + DEPT_CODES.length + ' départements' + updated;
  refreshMap();
  return true;
}

// Remplit le sélecteur avec les activités présentes dans le manifest
function populateNafSelect() {
  const codes = Object.keys(manifest?.naf || {}).sort();
  if (!codes.length) {
    // Sans manifest : activités connues
    const sel = document.getElementById('nafSelect');
    sel.innerHTML = Object.entries(NAF_DICT).map(([c, l]) => '<option value="' + c + '">' + c + ' — ' + esc(l) + '</option>').join('');
    sel.value = currentNaf;
    return;
  }
  const sel = document.getElementById('nafSelect');
  sel.innerHTML = '';
  codes.forEach(code => {
    const n = manifest.naf[code];
    const nbDepts = Object.values(n.depts || {}).filter(d => d.count > 0).length;
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = code + ' — ' + (n.label || NAF_DICT[code] || code) + (nbDepts < DEPT_CODES.length ? ' (' + nbDepts + ' dép.)' : '');
    sel.appendChild(opt);
  });
  if (!manifest.naf[currentNaf]) currentNaf = codes.includes('11.05Z') ? '11.05Z' : codes[0];
  sel.value = currentNaf;
}

// Scan export files to extract establishment counts
async function scanExports() {
  if (countsFromManifest()) return;
  deptInfo = {};
  if (scanCache[currentNaf]) {
    deptCounts = scanCache[currentNaf];
    document.getElementById('scanStatus').innerHTML =
      '&#x2714; ' + DEPT_CODES.filter(c => deptCounts[c] > 0).length + '/' + DEPT_CODES.length + ' fichiers trouvés (cache)';
    refreshMap();
    return;
  }

  const statusEl = document.getElementById('scanStatus');
  const naf = currentNaf;
  let scanned = 0;
  deptCounts = {};

  statusEl.innerHTML = '<div class="spinner"></div> Scan 0/' + DEPT_CODES.length;

  // Scan in batches of 6 to avoid hammering
  const BATCH = 6;
  for (let i = 0; i < DEPT_CODES.length; i += BATCH) {
    const batch = DEPT_CODES.slice(i, i + BATCH);
    const counts = await Promise.all(batch.map(fetchCount));
    if (naf !== currentNaf) return; // l'utilisateur a changé d'activité entre-temps
    batch.forEach((code, j) => { deptCounts[code] = counts[j]; });
    scanned += batch.length;
    statusEl.innerHTML = '<div class="spinner"></div> Scan ' + Math.min(scanned, DEPT_CODES.length) + '/' + DEPT_CODES.length;
    refreshMap();
  }

  scanCache[naf] = { ...deptCounts };
  const found = DEPT_CODES.filter(c => deptCounts[c] > 0).length;
  statusEl.innerHTML = '&#x2714; ' + found + '/' + DEPT_CODES.length + ' fichiers trouvés';
  refreshMap();
}

// ── État dans l'URL (?naf=11.05Z&mesure=hab), pour partager une vue ──────────

function syncUrl() {
  const p = new URLSearchParams();
  p.set('naf', currentNaf);
  if (mode !== 'count') p.set('mesure', mode);
  history.replaceState(null, '', '?' + p.toString());
}

function updateNaf() {
  currentNaf = document.getElementById('nafSelect').value;
  syncUrl();
  scanExports();
}

function updateMode() {
  mode = document.getElementById('modeSelect').value;
  syncUrl();
  refreshMap();
}

(function restoreUrl() {
  const p = new URLSearchParams(location.search);
  if (p.get('naf')) currentNaf = p.get('naf').toUpperCase();
  if (['hab', 'new'].includes(p.get('mesure'))) mode = p.get('mesure');
  document.getElementById('modeSelect').value = mode;
})();

// Init — le manifest est facultatif : sans lui, on scanne les fichiers d'export
const manifestReady = fetch('exports/manifest.json', { cache: 'no-cache' })
  .then(r => r.ok ? r.json() : null)
  .catch(() => null)
  .then(m => { manifest = m; populateNafSelect(); });

// Contours hébergés dans le dépôt (voir data/README.md pour la source et la licence)
fetch('data/departements.geojson')
  .then(r => r.json())
  .then(async data => {
    cachedGeoJson = preprocessGeoJson(data);
    loadGeoJson(cachedGeoJson);
    await manifestReady;
    scanExports();
  })
  .catch(err => {
    console.error('Erreur chargement GeoJSON:', err);
    document.getElementById('infoPanel').innerHTML =
      '<strong style="color:var(--accent2)">Erreur</strong><br/>Impossible de charger les contours des départements.';
  });
</script>
