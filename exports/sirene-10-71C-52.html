(function exportPageRuntime(D) {

        + '<div class="pnaf">' + esc(d.naf) + '</div>'
        + '<div class="paddr">' + esc([d.a1, d.a2].filter(Boolean).join(', ')) + '</div>'
        + (d.ap ? '<div class="papprox">Position approximative (centre de la commune)</div>' : '')
